name: 場所データを作る

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 1 * *'   # 毎月2日 3時17分（日本時間）

permissions:
  contents: write

concurrency:
  group: spots
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 10都県のデータを作る
        run: node tools/build-spots.mjs
      - name: できた分を保存する（一部だめでも、できた分は保存）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/spots-*.json || true
          if git diff --cached --quiet; then echo "変更なし"; else git commit -m "場所データを更新" && git push; fi
